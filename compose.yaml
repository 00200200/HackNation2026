services:
  backend:
    build: .
    restart: unless-stopped
    # Compose reads these from the ignored .env at start-up; they are never part of the image.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PRAWDOWID_MODEL: ${PRAWDOWID_MODEL:-}
      GOOGLE_FACTCHECK_API_KEY: ${GOOGLE_FACTCHECK_API_KEY:-}
      PYDANTIC_AI_NO_BANNER: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
