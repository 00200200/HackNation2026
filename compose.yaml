services:
  backend:
    build: .
    restart: unless-stopped
    # Compose reads these from the ignored .env at start-up; they are never part of the image.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PRAWDOWID_MODEL: ${PRAWDOWID_MODEL:-}
      GOOGLE_FACTCHECK_API_KEY: ${GOOGLE_FACTCHECK_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EUVSDISINFO_API_KEY: ${EUVSDISINFO_API_KEY:-}
      PRAWDOWID_GOVPL: ${PRAWDOWID_GOVPL:-1}
      # Scenario I base, a path relative to the repository root (e.g. incidents/base.csv). The
      # same relative path resolves under /app in the container, where ./incidents is mounted.
      PRAWDOWID_INCIDENTS_PATH: ${PRAWDOWID_INCIDENTS_PATH:-}
      PYDANTIC_AI_NO_BANNER: "1"
      # The image runs as nobody and /app is read-only to it, so the writable paths are set below.
      # The check log is the audit trail and the 30-day retention store (docs/privacy.md): it sits
      # on a named volume, so a redeploy (container recreated) keeps it. The source cache is
      # rebuilt on demand and stays in /tmp.
      PRAWDOWID_CHECK_LOG: /var/lib/prawdowid/checks.jsonl
      PRAWDOWID_CACHE: /tmp/prawdowid/docs.jsonl
      # Eval fault switch (docs/eval-notes.md): honoured only with this secret; leave it unset on
      # the public demo.
      PRAWDOWID_EVAL_TOKEN: ${PRAWDOWID_EVAL_TOKEN:-}
      # Bearer token for GET /api/cases, the moderator queue (docs/privacy.md); unset: no such
      # route. The cases file sits next to the check log, on the same volume.
      PRAWDOWID_ADMIN_TOKEN: ${PRAWDOWID_ADMIN_TOKEN:-}
    volumes:
      - ./incidents:/app/incidents:ro
      - checklog:/var/lib/prawdowid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Step 2c source store, opt-in (`make db`). Step 2c is disabled in the pipeline until licensed
  # sources are chosen (user decision), so no check reads it and the backend never connects to it.
  # Starts empty: the team seeds it with `make db-seed`. Schema from db/migrations/ on first start
  # of the volume. Port bound to 127.0.0.1 only. The default password is for this local-only
  # database; POSTGRES_PASSWORD applies only when the volume is created (see docs/sources.md).
  sourcedb:
    profiles: [sourcedb]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: prawdowid
      POSTGRES_DB: prawdowid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prawdowid}
    volumes:
      - sourcedb_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  # Second channel. Opt-in (make up DISCORD=1): it exits at once without DISCORD_BOT_TOKEN.
  discord:
    build: .
    profiles: [discord]
    restart: on-failure:3
    command: ["python", "-m", "prawdowid.discord_bot"]
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      PRAWDOWID_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
        restart: true

  frontend:
    build:
      context: ./frontend
      additional_contexts:
        fixtures: ./tests/fixtures/pages
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true

volumes:
  checklog:
  sourcedb_data:
