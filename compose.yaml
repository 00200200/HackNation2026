services:
  backend:
    build: .
    restart: unless-stopped
    # Compose reads these from the ignored .env at start-up; they are never part of the image.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PRAWDOWID_MODEL: ${PRAWDOWID_MODEL:-}
      GOOGLE_FACTCHECK_API_KEY: ${GOOGLE_FACTCHECK_API_KEY:-}
      PYDANTIC_AI_NO_BANNER: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Step 2c source store, opt-in (`make db`). Step 2c is disabled in the pipeline until licensed
  # sources are chosen (user decision), so here the backend gets no DATABASE_URL and never needs it
  # (compose.prod.yaml sets one for its own `db`; see docs/sources.md, Access).
  # Starts empty: the team seeds it with `make db-seed`. Schema from db/migrations/ on first start
  # of the volume. Port bound to 127.0.0.1 only. The default password is for this local-only
  # database; POSTGRES_PASSWORD applies only when the volume is created (see docs/sources.md).
  sourcedb:
    profiles: [sourcedb]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: prawdowid
      POSTGRES_DB: prawdowid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prawdowid}
    volumes:
      - sourcedb_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  # Second channel. Opt-in (make up DISCORD=1): it exits at once without DISCORD_BOT_TOKEN.
  discord:
    build: .
    profiles: [discord]
    restart: on-failure:3
    command: ["python", "-m", "prawdowid.discord_bot"]
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      PRAWDOWID_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
        restart: true

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true

volumes:
  sourcedb_data:
