# Source catalogue of faktczyfejk.pl: the auditable list behind corpus/evidence.jsonl.
# Rebuild the corpus from it with `make corpus`. Description for the jury: docs/corpus.md.
#
# status: active    collected into the corpus
#         live_only queried when a claim is checked, nothing stored
#         candidate fits the rules, not collected yet (the note says what is missing)
#         excluded  not used; stays here with the reason and the date
# Licences, terms and robots.txt were read on the live sites on 2026-11-21.

rules:
  admit:
    - Official Polish or EU bodies publishing under their own name (ministries, agencies, services, Sejm, EU institutions).
    - Fact-checkers with a current IFCN or EFCSN status, read on the network's own member page; the entry records the date.
    - The incident base named by the organiser (EUvsDisinfo).
    - Every entry needs terms that allow at least a short fragment with a link, and a way to fetch it without going around robots.txt, a login, a paywall or bot protection.
  storage:
    - Full text only under a licence or terms that allow it (CC BY-SA 4.0, reuse with attribution, legal acts outside copyright). Each document carries its licence.
    - Otherwise metadata, a fragment of at most 500 characters and the link.
    - No images, audio or video. E-mail addresses are masked. Job adverts are skipped (they list contact persons and are not evidence).
    - Who made a claim, and where, is stored only for public statements of public figures (Demagog's statements section), never for posts of private people.
  update:
    - Each entry has an update interval. `make corpus` fetches again every list, feed and API answer older than that interval; article pages stay cached until `make corpus ARGS=--refresh`. At most about one request per second per registered domain, with a generic User-Agent.
    - A source that fails or is blocked keeps its records from the previous build, and the manifest says so. A build that misses a threshold writes nothing.
    - Every document keeps its own publication date (null when the page states none) and retrieval time.
    - Licence, terms and IFCN or EFCSN status are read again when an entry is added and before a release.
  exclude:
    - "robots.txt disallows the path, the site answers with a bot challenge or refuses automated clients, or the content exists only in a script-rendered app. Exception, recorded in the entry: an official portal whose own pages load the content from a public JSON endpoint without a login; then we read that JSON."
    - The source is dead or blocked for longer than one update interval, loses its IFCN or EFCSN status, or changes its terms so that a fragment may no longer be stored.
    - Excluded entries stay in this file with the reason and the date. A single document is removed by adding it to `removed_urls` and rebuilding.

# Documents removed on request or after a correction: {url, reason, removed_on}.
removed_urls: []

x-shared:
  govpl: &govpl
    domain: www.gov.pl
    source_type: official
    licence: CC BY-SA 4.0 (treści tekstowe serwisu gov.pl, bez materiałów audiowizualnych)
    licence_url: https://www.gov.pl/  # stated in the footer of every page
    licence_checked: 2026-11-21
    storage: full_text
    access: server-rendered news list (?page=N&size=10), article pages
    update_interval: 24h
    added: 2026-11-21
    status: active
    collector: news_list
  govpl_pages: &govpl_pages
    domain: www.gov.pl
    source_type: official
    licence: CC BY-SA 4.0 (treści tekstowe serwisu gov.pl, bez materiałów audiowizualnych)
    licence_url: https://www.gov.pl/
    licence_checked: 2026-11-21
    storage: full_text
    access: single information pages
    update_interval: 7d
    added: 2026-11-21
    status: active
    collector: pages
  policja: &policja
    source_type: official
    licence: "Zasady serwisu: wykorzystanie materiałów z podaniem źródła (policja.pl); utwory osób trzecich wyłączone"
    licence_checked: 2026-11-21
    storage: full_text
    access: server-rendered news list (?page=N, from 0), article pages
    update_interval: 24h
    added: 2026-11-21
    status: active
    collector: news_list
  blocked: &blocked
    licence: not checked (no access)
    storage: none
    access: none
    update_interval: "-"
    added: 2026-11-21
    status: excluded
    excluded_on: 2026-11-21

