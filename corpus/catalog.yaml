  # ---- Official and primary sources: other domains ---------------------------------------
  - id: cert-komunikaty
    domain: moje.cert.pl
    publisher: CERT Polska (NASK)
    source_type: official
    licence: CC BY-SA 4.0 (komunikaty bezpieczeństwa, o ile nie zaznaczono inaczej)
    licence_url: https://moje.cert.pl/komunikaty/
    licence_checked: 2026-11-21
    storage: full_text
    access: server-rendered list /komunikaty/?page=N, advisory pages
    update_interval: 24h
    added: 2026-11-21
    status: active
    note: robots.txt allows only /, /komunikaty/ and /faq/. The RSS feed /advisories/feed/ is disallowed, so it is not used.
    collector: news_list
    params: {parser: cert, list_url: "https://moje.cert.pl/komunikaty/?page={page}", pages: 29}
  - <<: *policja
    id: policja-kgp
    domain: policja.pl
    publisher: Komenda Główna Policji
    licence_url: https://policja.pl/pol/wolnytekst/46616,dok.html
    params: {parser: policja, list_url: "https://policja.pl/pol/aktualnosci?page={page}", first_page: 0, pages: 4}
  - <<: *policja
    id: policja-mazowiecka
    domain: mazowiecka.policja.gov.pl
    publisher: Komenda Wojewódzka Policji z siedzibą w Radomiu
    licence_url: https://mazowiecka.policja.gov.pl/ra/wolnytekst/10,Prawa-autorskie.html
    params: {parser: policja, list_url: "https://mazowiecka.policja.gov.pl/ra/aktualnosci/aktualnosci?page={page}", first_page: 0, pages: 2}
  - id: sejm-eli
    domain: api.sejm.gov.pl
    publisher: Kancelaria Sejmu, Internetowy System Aktów Prawnych (Dziennik Ustaw)
    source_type: official
    licence: Akty normatywne nie są przedmiotem prawa autorskiego (art. 4 pkt 1 ustawy o prawie autorskim i prawach pokrewnych)
    licence_url: https://api.sejm.gov.pl/eli/openapi/
    licence_checked: 2026-11-21
    storage: full_text
    access: ELI API without a key (/acts/search, /acts/DU/{year}/{pos}/text.html)
    update_interval: 7d
    added: 2026-11-21
    status: active
    note: For each phrase below, the act in force whose title ends with it, preferably its newest consolidated text (obwieszczenie o jednolitym tekście); amendments and ratifications are skipped. Only versions with an HTML text (acts from 2025 on are PDF only), so a consolidated text can be older than the latest amendment; its date is kept. Texts are cut at max_chars; the record says so in `truncated`.
    collector: sejm_eli
    params:
      max_chars: 30000
      titles:
        - ochronie ludności i obronie cywilnej
        - zarządzaniu kryzysowym
        - krajowym systemie cyberbezpieczeństwa
        - zwalczaniu nadużyć w komunikacji elektronicznej
        - stanie wyjątkowym
        - stanie klęski żywiołowej
        - obronie Ojczyzny
        - ochronie granicy państwowej
        - otwartych danych i ponownym wykorzystywaniu informacji sektora publicznego
        - systemie powiadamiania ratunkowego
        - Państwowej Straży Pożarnej
        - bezpieczeństwie żywności i żywienia
        - zapobieganiu oraz zwalczaniu zakażeń i chorób zakaźnych u ludzi
        - transporcie kolejowym
        - Prawo lotnicze
        - Prawo atomowe
        - ochronie danych osobowych
        - świadczeniu usług drogą elektroniczną
        - prawie autorskim i prawach pokrewnych
        - dostępie do informacji publicznej
  - id: imgw-warnings
    domain: danepubliczne.imgw.pl
    publisher: Instytut Meteorologii i Gospodarki Wodnej – Państwowy Instytut Badawczy
    source_type: official
    licence: "Regulamin udostępniania danych IMGW-PIB: nieodpłatnie, z podaniem źródła. „Źródłem pochodzenia danych jest Instytut Meteorologii i Gospodarki Wodnej – Państwowy Instytut Badawczy”. „Dane Instytutu Meteorologii i Gospodarki Wodnej – Państwowego Instytutu Badawczego zostały przetworzone”."
    licence_url: https://danepubliczne.imgw.pl/
    licence_checked: 2026-11-21
    storage: full_text
    access: public JSON API without a key (/api/data/warningsmeteo, /api/data/warningshydro)
    update_interval: 1h
    added: 2026-11-21
    status: active
    note: A snapshot of the warnings valid at build time; it goes stale within hours. The answer must show both attribution sentences from the licence. The terms treat ad-funded publication as commercial use, which needs a contract; this service has no ads.
    collector: imgw_warnings
    params: {snapshot: true}  # a failed build drops old warnings instead of keeping them
  - id: eurlex
    domain: publications.europa.eu
    publisher: Urząd Publikacji Unii Europejskiej (EUR-Lex)
    source_type: official
    licence: "© Unia Europejska. Dokumenty prawne z EUR-Lex można wykorzystywać do celów komercyjnych i niekomercyjnych z podaniem źródła (informacja prawna EUR-Lex, decyzja 2011/833/UE)"
    licence_url: https://eur-lex.europa.eu/content/legal-notice/legal-notice.html
    licence_checked: 2026-11-21
    storage: full_text
    access: Cellar API of the Publications Office (/resource/celex/{number}, content negotiation); records link to the EUR-Lex page of the act
    update_interval: 30d
    added: 2026-11-21
    status: active
    note: "The text as first published in the Official Journal, without later amendments, cut at max_chars. The EUR-Lex website itself answers scripted clients with a bot challenge (HTTP 202), so it is not scraped. Acts: ban on RT and Sputnik broadcasts, Digital Services Act, European Media Freedom Act, passenger rights (air, rail, bus, sea)."
    collector: eurlex
    params:
      max_chars: 40000
      celex: ["32022R0350", "32022R2065", "32024R1083", "32004R0261", "32021R0782", "32011R0181", "32010R1177"]
  - id: odyseusz
    domain: odyseusz.gov.pl
    publisher: Ministerstwo Spraw Zagranicznych (serwis Odyseusz)
    source_type: official
    licence: "Materiał urzędowy MSZ (art. 4 pkt 2 ustawy o prawie autorskim i prawach pokrewnych), informacja sektora publicznego. Serwis nie podaje licencji; organizator (MSZ) wskazał go jako źródło do pobierania (mentor, Discord, 21.11.2026)"
    licence_url: https://odyseusz.gov.pl/o-serwisie/informacje-prawne
    licence_checked: 2026-11-21
    storage: full_text
    access: JSON endpoints called by the portal's own pages (/api/v1/informacje/...); public, not documented
    update_interval: 6h
    added: 2026-11-21
    status: active
    note: First on the organiser's list and used in the organiser's example answers. The portal is a single-page app; under the exception in rules.exclude the text is read from the public JSON its pages load (no login, no robots.txt rules). Country profiles carry the current MSZ notice and the travel warning level. Consular contact details and flag images are not stored. A country record links to the JSON endpoint, because the address of the rendered country page could not be confirmed without running the app.
    collector: odyseusz
    params: {max_chars: 8000}  # the notice and the warning come first
  - id: gus
    domain: new.stat.gov.pl
    publisher: Główny Urząd Statystyczny
    source_type: official
    licence: CC BY 4.0 (stopka serwisu GUS)
    licence_url: https://new.stat.gov.pl/
    licence_checked: 2026-11-21
    storage: full_text
    access: server-rendered news list (?page=N, from 0), article pages
    update_interval: 24h
    added: 2026-11-21
    status: active
    note: Official statistics news, including GUS warnings about e-mails impersonating the office. The articles are short and mostly link to the statistical releases.
    collector: news_list
    params: {parser: gus, list_url: "https://new.stat.gov.pl/aktualnosci?page={page}", first_page: 0, pages: 4}
  - id: kgsok
    domain: kgsok.pl
    publisher: Komenda Główna Straży Ochrony Kolei
    source_type: official
    licence: Brak licencji na stronie – metadane, fragment do 500 znaków i link (prawo cytatu, art. 29 pr. aut.)
    licence_url: https://kgsok.pl/
    licence_checked: 2026-11-21
    storage: excerpt
    access: RSS feed (/feed/, ?paged=N)
    update_interval: 24h
    added: 2026-11-21
    status: active
    collector: feed
    params: {feeds: ["https://kgsok.pl/feed/", "https://kgsok.pl/feed/?paged=2", "https://kgsok.pl/feed/?paged=3"]}

  # ---- Reliable secondary sources: fact-checkers -----------------------------------------
  - &demagog
    id: demagog-fake-news
    domain: demagog.org.pl
    publisher: Stowarzyszenie Demagog
    source_type: fact_checker
    licence: "Brak licencji; robots.txt: search=yes, use=reference. Metadane, ocena, fragment do 500 znaków, link"
    licence_url: https://demagog.org.pl/robots.txt
    licence_checked: 2026-11-21
    storage: excerpt
    access: RSS feed pages (?paged=N) for discovery, then the ClaimReview markup, the summary and the cited links of each page
    update_interval: 24h
    added: 2026-11-21
    status: active
    note: EFCSN verified member, valid until 2027-05-25 (members.efcsn.com/organization/demagog, read 2026-11-21). IFCN signatory according to Demagog; IFCN's own list could not be read automatically (UNCONFIRMED).
    collector: claim_reviews
    params:
      feeds: ["https://demagog.org.pl/fake_news/feed/"]
      pages: 15
      summary_xpath: '//div[contains(@class, "summary-text")]'
  - <<: *demagog
    id: demagog-wypowiedzi
    params:
      feeds: ["https://demagog.org.pl/wypowiedzi/feed/"]
      pages: 15
      summary_xpath: '//div[contains(@class, "summary-text")]'
      public_claimants: true
  - <<: *demagog
    id: demagog-analizy
    access: RSS feed (title, date and summary)
    collector: feed
    params: {feeds: ["https://demagog.org.pl/feed/"], drop: "Artykuł .{0,300}? pochodzi z serwisu Demagog\\s*\\."}
  - id: pravda
    domain: pravda.org.pl
    publisher: Stowarzyszenie Pravda
    source_type: fact_checker
    licence: Brak licencji na stronie – metadane, fragment do 500 znaków i link (prawo cytatu, art. 29 pr. aut.)
    licence_url: https://pravda.org.pl/
    licence_checked: 2026-11-21
    storage: excerpt
    access: RSS feed (/rss/); only the title, date and summary are kept
    update_interval: 24h
    added: 2026-11-21
    status: active
    note: EFCSN verified member, valid until 2028-02-23 (members.efcsn.com/organization/pravda, read 2026-11-21).
    collector: feed
    params: {feeds: ["https://pravda.org.pl/rss/"]}
  - id: google-factcheck
    domain: factchecktools.googleapis.com
    publisher: Google Fact Check Tools (ClaimReview published by the fact-checkers)
    source_type: fact_checker
    licence: "Metadane ClaimReview publikowane przez weryfikatorów; Google APIs Terms of Service – przechowujemy twierdzenie, ocenę i link"
    licence_url: https://developers.google.com/fact-check/tools/api
    storage: excerpt
    access: claims:search (languageCode=pl, reviewPublisherSiteFilter); the key goes in a header
    update_interval: 24h
    added: 2026-11-21
    status: active
    note: Named by the organiser. Needs a key from a Google Cloud project; not run yet, so the response shape is UNVERIFIED against the live API. Only publishers admitted above are queried.
    collector: google_factcheck
    requires_env: GOOGLE_FACTCHECK_API_KEY
    params: {publisher_sites: [demagog.org.pl, pravda.org.pl], max_pages: 3}

  # ---- Incident base -----------------------------------------------------------------------
  - id: euvsdisinfo
    domain: euvsdisinfo.eu
    publisher: EUvsDisinfo (East StratCom Task Force, European External Action Service)
    source_type: incident_base
    licence: UNCONFIRMED – do potwierdzenia u organizatora razem z tokenem; do tego czasu tylko fragment do 500 znaków i link
    licence_url: https://euvsdisinfo.eu/
    storage: excerpt
    language: en
    access: MCP server named by the organiser (streamable HTTP, tool `cases`), token in a header
    update_interval: 7d
    added: 2026-11-21
    status: active
    note: Named by the organiser. Needs a token (form on euvsdisinfo.eu or a message to the mentor); not run yet, so UNVERIFIED against the live server. Also writes corpus/disinfo_domains.json, the domain list for the neutral warning of ADR 0001 section 5. The website itself answers HTTP 403 to automated clients and is not scraped.
    collector: euvsdisinfo
    requires_env: EUVSDISINFO_TOKEN
    params: {scan_cases: 20000, max_docs: 300, domains_out: corpus/disinfo_domains.json}

  # ---- Queried live, not stored --------------------------------------------------------------
