server {
    listen 80;
    root /usr/share/nginx/html;

    # Input limit is 5000 characters; anything far larger is not a real check.
    client_max_body_size 64k;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        # $uri.html serves /zrodla from zrodla.html, without a redirect to a trailing slash.
        try_files $uri $uri.html $uri/ =404;
        # Demo browsers must pick up new app.js right after a rebuild.
        expires -1;
    }

    location ~ ^/(api/|health$) {
        proxy_pass http://backend:8000;
        # Overwrite, do not append: the backend trusts this header for per-client rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }
}
