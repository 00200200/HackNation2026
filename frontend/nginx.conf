# The API docs page (FastAPI's Swagger UI) takes its script and styles from cdn.jsdelivr.net
# and starts from one inline script, allowed by its hash. Only /api/docs gets this wider
# policy. tests/test_openapi.py fails when the hash and FastAPI's page drift apart.
map $uri $csp {
    default "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'";
    /api/docs "default-src 'self'; script-src 'sha256-TsjSCX4yUK50HmnZXTe4FVW3iPTz1cIqzuXQu1ozcFU=' https://cdn.jsdelivr.net; style-src https://cdn.jsdelivr.net; img-src 'self' data:; frame-ancestors 'none'";
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Input limit is 5000 characters; anything far larger is not a real check.
    client_max_body_size 64k;

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        # $uri.html: /czat serves czat.html (the messenger demo adapter) and /zrodla serves zrodla.html,
        # without a redirect to a trailing slash.
        try_files $uri $uri.html $uri/ =404;
        # Demo browsers must pick up new app.js right after a rebuild.
        expires -1;
    }

    # Injection fixtures for the eval (tests/fixtures/pages, copied in at build time, see
    # frontend/Dockerfile): public so the product's fetcher can read them, hidden from search engines.
    # add_header here replaces the inherited ones, so the server-level headers are repeated.
    location ^~ /eval-fixtures/ {
        default_type text/html;
        charset utf-8;
        try_files $uri =404;
        expires -1;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location ~ ^/(api/|health$) {
        proxy_pass http://backend:8000;
        # Overwrite, do not append: the backend trusts this header for per-client rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }
}
