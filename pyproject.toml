[project]
name = "hacknation2026"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.16.0",
    "discord-py>=2.7.1",
    "fastapi>=0.165.0",
    "httpcore2>=2.16.2",
    "httpx2>=2.16.2",
    "psycopg[binary]>=3.3.9",
    "pydantic-ai-slim[anthropic,mcp]>=2.71.0",
    "pypdf>=7.1.1",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fastmcp-slim[server]>=4.2.4",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
