[project]
name = "hacknation2026"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.1",
    "discord-py>=2.7.1",
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "pydantic-ai-slim[anthropic]>=2.71.0",
    "slowapi>=0.1.10",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
