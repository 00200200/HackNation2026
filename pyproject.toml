[project]
name = "hacknation2026"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.16.0",
    "cachetools>=8.0.2",
    "discord-py>=2.7.1",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "httpcore2>=2.16.2",
    "httpx2>=2.16.2",
    "pgvector>=0.5.1",
    "protego>=0.7.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-ai-slim[anthropic,mcp]>=2.71.0",
    "pypdf>=7.1.1",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    # Also the corpus build (`make corpus`): fastmcp, feedparser, lxml, pyyaml, tldextract.
    # Kept here so the API image (UV_NO_DEV) stays small. protego is a runtime dependency
    # (safefetch reads robots.txt with it), which the corpus build uses too.
    "fastmcp-slim[server]>=4.2.4",
    "feedparser>=6.0.14",
    "lxml>=6.1.3",
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
    "ruff>=0.17.6",
    "tldextract>=5.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
